<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="360" fill="#f3f6f4"/>
  <g stroke="#dfe6e1" stroke-width="1">
    <path d="M0 60 H880 M0 140 H880 M0 220 H880 M0 300 H880"/>
    <path d="M120 0 V360 M280 0 V360 M440 0 V360 M600 0 V360 M760 0 V360"/>
  </g>

  <!-- strade -->
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 300 L200 300 L300 210 L520 190 L640 120 L840 110"/>
    <path d="M300 210 L320 60"/>
    <path d="M520 190 L560 320"/>
  </g>
  <g fill="none" stroke="#e8ded0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 300 L200 300 L300 210 L520 190 L640 120 L840 110"/>
    <path d="M300 210 L320 60"/>
    <path d="M520 190 L560 320"/>
  </g>

  <!-- zona -->
  <circle cx="140" cy="300" r="52" fill="#2f6fed" fill-opacity=".12" stroke="#2f6fed" stroke-opacity=".55" stroke-width="2"/>
  <rect x="104" y="291" width="72" height="20" rx="10" fill="#2b3440"/>
  <text x="140" y="305" fill="#fff" font-size="12" text-anchor="middle">Casa</text>

  <!-- scia agganciata -->
  <path d="M140 300 L200 300 L300 210 L520 190 L640 120 L800 112"
        fill="none" stroke="#e0457b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>

  <!-- frecce -->
  <g fill="#fff" stroke="#222" stroke-width="1.2" stroke-linejoin="round">
    <path d="M250 255 l9 11 l-5 0 l0 9 l-8 0 l0 -9 l-5 0 z" transform="rotate(48 250 262)"/>
    <path d="M420 196 l9 11 l-5 0 l0 9 l-8 0 l0 -9 l-5 0 z" transform="rotate(95 420 203)"/>
    <path d="M700 112 l9 11 l-5 0 l0 9 l-8 0 l0 -9 l-5 0 z" transform="rotate(93 700 119)"/>
  </g>

  <!-- pallini -->
  <g fill="#e0457b" stroke="#fff" stroke-width="1.5">
    <circle cx="200" cy="300" r="5"/><circle cx="238" cy="266" r="5"/>
    <circle cx="300" cy="210" r="5"/><circle cx="392" cy="202" r="5"/>
    <circle cx="520" cy="190" r="5"/><circle cx="596" cy="146" r="5"/>
    <circle cx="640" cy="120" r="5"/><circle cx="800" cy="112" r="5"/>
  </g>

  <!-- persona -->
  <circle cx="800" cy="112" r="17" fill="#fff" stroke="#e0457b" stroke-width="3"/>
  <text x="800" y="118" font-size="15" text-anchor="middle" fill="#e0457b">M</text>

  <!-- didascalie -->
  <g font-size="13" fill="#33404d">
    <circle cx="600" cy="286" r="5" fill="#e0457b" stroke="#fff" stroke-width="1.5"/>
    <text x="614" y="291">un pallino = una posizione che il telefono ha davvero mandato</text>
    <rect x="596" y="306" width="18" height="6" rx="3" fill="#e0457b"/>
    <text x="620" y="313">la scia, appoggiata sulle strade vere</text>
    <path d="M600 334 l7 9 l-4 0 l0 7 l-6 0 l0 -7 l-4 0 z" fill="#fff" stroke="#222" stroke-width="1.2"/>
    <text x="614" y="343">le frecce dicono da che parte stava andando</text>
  </g>
  <text x="30" y="34" font-size="19" font-weight="600" fill="#1f2a36">mappa-persone</text>
  <text x="30" y="54" font-size="13" fill="#5a6875">dove sono adesso, e dove sono state nelle ore passate</text>
</svg>
